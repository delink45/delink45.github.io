<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>T-SPARK Mic</title>
<style>
:root{
  --red:#C8102E;--red-d:#9e0d24;--red-l:#fce8eb;
  --bg:#f4f5f7;--card:#ffffff;--ink:#1b1f27;--mute:#667085;--line:#e4e7ec;
  --ok:#0f7b45;--bad:#c0262d;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
body{font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;display:flex;flex-direction:column;min-height:100vh}
[hidden]{display:none!important}
button{font:inherit}

.top{background:linear-gradient(120deg,#C8102E 0%,#a30d26 100%);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 12px rgba(200,16,46,.25)}
.top b{font-size:16px;letter-spacing:.3px}
.top small{opacity:.85;font-size:12px;margin-left:auto}

main{flex:1;width:100%;max-width:460px;margin:0 auto;padding:22px 18px 12px;display:flex;flex-direction:column;align-items:center;text-align:center}

/* ---------- bola mikrofon ---------- */
.stage{position:relative;width:170px;height:170px;display:flex;align-items:center;justify-content:center;margin:4px 0 8px}
.stage .ring{position:absolute;inset:18px;border-radius:50%;background:rgba(200,16,46,.18);opacity:0;transform:scale(1)}
.orb{position:relative;z-index:2;width:112px;height:112px;border-radius:50%;border:0;cursor:pointer;color:#fff;
  background:radial-gradient(circle at 35% 30%,#ff6b82,#C8102E 60%,#8f0a20);
  box-shadow:0 8px 24px rgba(200,16,46,.35);display:flex;align-items:center;justify-content:center;transition:transform .15s,box-shadow .2s,background .3s}
.orb:hover{transform:scale(1.04)}
.orb:active{transform:scale(.97)}
.orb:focus-visible{outline:3px solid #FFD65A;outline-offset:4px}
.orb svg{width:46px;height:46px}

body[data-s="listen"] .ring,body[data-s="hear"] .ring{animation:pulse 1.8s ease-out infinite}
body[data-s="listen"] .ring.r2,body[data-s="hear"] .ring.r2{animation-delay:.9s}
body[data-s="hear"] .ring{animation-duration:.9s}
body[data-s="hear"] .orb{box-shadow:0 8px 30px rgba(200,16,46,.55)}
body[data-s="done"] .orb{background:radial-gradient(circle at 35% 30%,#3fcf86,#0f7b45 60%,#0a5a32);box-shadow:0 8px 24px rgba(15,123,69,.35)}
body[data-s="done"] .ring{background:rgba(15,123,69,.18)}
body[data-s="err"] .orb{background:radial-gradient(circle at 35% 30%,#8a8f99,#5b616c 60%,#3e434c);box-shadow:0 8px 24px rgba(60,66,76,.3)}
@keyframes pulse{0%{opacity:.8;transform:scale(.8)}100%{opacity:0;transform:scale(1.45)}}

/* ---------- gelombang ---------- */
.bars{height:34px;display:flex;align-items:center;justify-content:center;gap:5px;margin:0 0 8px;opacity:0;transition:opacity .25s}
.bars i{display:block;width:5px;height:8px;border-radius:3px;background:var(--red);transform-origin:50% 50%}
body[data-s="listen"] .bars{opacity:.45}
body[data-s="hear"] .bars{opacity:1}
body[data-s="listen"] .bars i{animation:wave 1.6s ease-in-out infinite}
body[data-s="hear"] .bars i{animation:wave .6s ease-in-out infinite}
.bars i:nth-child(1){animation-delay:0s}.bars i:nth-child(2){animation-delay:.12s}.bars i:nth-child(3){animation-delay:.24s}
.bars i:nth-child(4){animation-delay:.36s}.bars i:nth-child(5){animation-delay:.24s}.bars i:nth-child(6){animation-delay:.12s}.bars i:nth-child(7){animation-delay:0s}
@keyframes wave{0%,100%{height:8px}50%{height:32px}}

h1{font-size:19px;margin:0 0 4px;font-weight:800}
#hint{margin:0 0 14px;color:var(--mute);font-size:13px;min-height:19px;max-width:360px}
body[data-s="err"] #hint{color:var(--bad)}

.tx{width:100%;min-height:64px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:17px;font-weight:600;overflow-wrap:anywhere;text-align:left}
.tx.empty{border-style:dashed;color:#98a2b3;font-weight:500;font-size:14px}
.tx.empty:before{content:"Teks ucapan Boss akan muncul di sini";}
.raw{width:100%;margin:6px 0 0;padding:0 4px;color:var(--mute);font-size:12.5px;text-align:left;overflow-wrap:anywhere}
.raw b{color:var(--ink)}

.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:700;font-size:13.5px}
.btn:hover{background:#f2f4f7}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.red:hover{background:var(--red-d)}

.foot{margin:auto 0 0;padding:18px 6px 6px;color:#98a2b3;font-size:11.5px;max-width:380px}

@media (prefers-reduced-motion:reduce){
  .ring,.bars i{animation:none!important}
}
</style>
</head>
<body data-s="idle">
<div class="top"><b>T-SPARK AI</b><small>Mikrofon</small></div>

<main>
  <div class="stage">
    <span class="ring"></span><span class="ring r2"></span>
    <button class="orb" id="orb" type="button" aria-label="Mulai atau selesai bicara">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="9" y="3" width="6" height="11" rx="3"></rect>
        <path d="M5 11a7 7 0 0 0 14 0"></path>
        <path d="M12 18v3"></path>
        <path d="M9 21h6"></path>
      </svg>
    </button>
  </div>
  <div class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>

  <h1 id="st" aria-live="polite">Menyiapkan mikrofon…</h1>
  <p id="hint"></p>

  <div class="tx empty" id="tx" aria-live="polite"></div>
  <p class="raw" id="raw" hidden></p>

  <div class="row">
    <button class="btn red" id="bSend" type="button" hidden>Kirim sekarang</button>
    <button class="btn" id="bAgain" type="button" hidden>Bicara lagi</button>
    <button class="btn" id="bCopy" type="button" hidden>Salin teks</button>
  </div>

  <p class="foot">Halaman ini hanya mengubah suara menjadi teks memakai pengenalan suara Chrome (bahasa Indonesia), lalu mengirim teksnya ke T-SPARK AI. Tidak ada login, data bengkel, atau kunci yang disimpan di sini.</p>
</main>

<script>
(function(){
'use strict';
var $=function(i){return document.getElementById(i);};
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;

/* Kode pengaman dari T-SPARK AI (ikut di alamat setelah tanda #); dikirim balik bersama teks. */
var NONCE='';
try{var mm=/[#&]n=([A-Za-z0-9]+)/.exec(location.hash||'');if(mm)NONCE=mm[1];}catch(e){}
var HAS_OPENER=false;
try{HAS_OPENER=!!(window.opener&&!window.opener.closed);}catch(e){HAS_OPENER=false;}

var rec=null,finalTxt='',interimTxt='',txt='',rawTxt='',errCode='',sent=false,tmr=0;

/* Kamus koreksi salah dengar: istilah T-SPARK yang sering terdengar keliru oleh pengenal suara.
   Dipasang pada teks asli; hasilnya dikirim sebagai 'text', teks asli ikut dikirim sebagai 'raw'. */
var KAMUS=[
  [/\b(?:c|ce|se|ci|si)\s*(?:p|pe)\s*u\s*(?:e\s*s|es|s)\b/gi,'CPUS'],
  [/\bc\s*p\s*u\s*s\b/gi,'CPUS'],
  [/\bcpu\s*(?:es|s)\b/gi,'CPUS'],
  [/\bcepeues\b/gi,'CPUS'],
  [/\b(?:es|s)\s*(?:be|b)\s*(?:e|ee)\b/gi,'SBE'],
  [/\bunit\s+entri\b/gi,'Unit Entry'],
  [/\b(?:yunit|junit)\s+(?:entri|entry)\b/gi,'Unit Entry'],
  [/\b(?:revenu|revenyu|rivenyu|reveniu|revenew|rivenue)\b/gi,'revenue'],
  [/\b(?:vendar|vender|fendor|fendar)\b/gi,'vendor'],
  [/\b(?:es\s+a|esa)\b/gi,'SA'],
  [/\b(?:achivement|acievement|ekivmen|akivmen|ekhivmen)\b/gi,'achievement'],
  [/\b(?:t|ti)\s*[- ]\s*spark\b/gi,'T-SPARK']
];
function koreksi(t){
  var o=t,i;
  for(i=0;i<KAMUS.length;i++)o=o.replace(KAMUS[i][0],KAMUS[i][1]);
  return o.replace(/\s+/g,' ').trim();
}
function setRaw(r,c){
  var e=$('raw');
  if(r&&c&&r!==c){e.innerHTML='';var b=document.createElement('b');b.textContent='Terdengar: ';e.appendChild(b);e.appendChild(document.createTextNode(r+' \u2192 dibaca sebagai di atas.'));e.hidden=false;}
  else{e.hidden=true;e.textContent='';}
}
var BTN=['bSend','bAgain','bCopy'];
var IZIN='Izin mikrofon ditolak. Klik ikon gembok di sebelah alamat halaman ini, ubah Mikrofon menjadi Izinkan, lalu ketuk bola mikrofon lagi.';
var ERR={
  'not-allowed':IZIN,
  'service-not-allowed':IZIN,
  'audio-capture':'Mikrofon tidak ditemukan. Pastikan mikrofon terpasang dan tidak sedang dipakai aplikasi lain.',
  'network':'Pengenalan suara butuh internet dan tidak tersambung ke layanan Google. Periksa koneksi, lalu coba lagi.',
  'language-not-supported':'Bahasa Indonesia tidak didukung oleh browser ini.'
};

function setS(s,title,hint){
  document.body.setAttribute('data-s',s);
  $('st').textContent=title;$('hint').textContent=hint||'';
}
function show(list){BTN.forEach(function(id){$(id).hidden=list.indexOf(id)<0;});}
function clearT(){if(tmr){clearInterval(tmr);tmr=0;}}
function setTx(t){$('tx').textContent=t||'';$('tx').classList.toggle('empty',!t);}

function post(type,extra){
  if(!HAS_OPENER)return false;
  var m={app:'tspark-mic',nonce:NONCE,type:type},k;
  for(k in (extra||{}))m[k]=extra[k];
  /* Asal jendela T-SPARK (bingkai Google) berganti-ganti, jadi tujuan '*'. Isinya hanya teks ucapan. */
  try{window.opener.postMessage(m,'*');return true;}catch(e){return false;}
}

function fail(msg,code){
  clearT();
  setS('err','Mikrofon bermasalah',msg);
  show(['bAgain']);
  post('error',{message:msg,code:code||''});
}

function start(){
  clearT();
  if(rec){try{rec.abort();}catch(e){}rec=null;}
  txt='';finalTxt='';interimTxt='';errCode='';sent=false;
  setTx('');setRaw('','');rawTxt='';show([]);
  if(!SR){fail('Browser ini tidak mendukung pengenalan suara. Buka lewat Google Chrome atau Microsoft Edge.','unsupported');return;}
  var r;
  try{r=new SR();}catch(e){fail('Pengenalan suara tidak bisa dimulai ('+(e&&e.name?e.name:'error')+').','start');return;}
  rec=r;
  r.lang='id-ID';r.interimResults=true;r.continuous=false;r.maxAlternatives=1;
  setS('wait','Meminta izin mikrofon…','Bila browser bertanya, klik Izinkan.');
  r.onstart=function(){if(rec!==r)return;setS('listen','Mendengarkan…','Silakan bicara. Berhenti sebentar kalau sudah selesai.');};
  r.onspeechstart=function(){if(rec!==r)return;setS('hear','Terdengar suara…','');};
  r.onresult=function(ev){
    if(rec!==r)return;
    var f='',t='',i;
    for(i=0;i<ev.results.length;i++){
      if(ev.results[i].isFinal)f+=ev.results[i][0].transcript;else t+=ev.results[i][0].transcript;
    }
    finalTxt=f;interimTxt=t;
    setTx((f+' '+t).replace(/\s+/g,' ').trim());
  };
  r.onerror=function(ev){
    if(rec!==r)return;
    var c=(ev&&ev.error)||'error';
    if(c==='aborted')return;
    if(c==='no-speech'){errCode='';return;}      /* ditangani di onend */
    errCode=c;
    fail(ERR[c]||('Pengenalan suara gagal ('+c+').'),c);
  };
  r.onend=function(){
    if(rec!==r)return;
    rec=null;
    if(errCode)return;
    var t=(finalTxt||interimTxt||'').replace(/\s+/g,' ').trim();
    if(!t){
      setS('idle','Tidak ada suara terdengar','Ketuk bola mikrofon, lalu bicara lebih dekat ke mikrofon.');
      show(['bAgain']);return;
    }
    gotText(t);
  };
  try{r.start();}catch(e){fail('Pengenalan suara tidak bisa dimulai ('+(e&&e.name?e.name:'error')+').','start');}
}

function gotText(t){
  rawTxt=t;txt=koreksi(t);setTx(txt);setRaw(rawTxt,txt);
  if(!HAS_OPENER){
    setS('done','Teks terbaca','Halaman ini dibuka langsung (bukan dari T-SPARK AI), jadi tidak ada yang dikirimi. Ini hanya uji mikrofon.');
    show(['bCopy','bAgain']);return;
  }
  var n=2;
  setS('got','Mengirim dalam '+n+' detik…','Salah dengar? Ketuk "Bicara lagi" untuk mengulang.');
  show(['bSend','bAgain']);
  tmr=setInterval(function(){
    n--;
    if(n<=0){doSend();return;}
    setS('got','Mengirim dalam '+n+' detik…','Salah dengar? Ketuk "Bicara lagi" untuk mengulang.');
  },1000);
}

function doSend(){
  clearT();
  if(sent||!txt)return;
  sent=true;
  if(post('text',{text:txt,raw:rawTxt})){
    setS('done','Terkirim ke T-SPARK AI','Jendela ini menutup sendiri.');
    show([]);
    setTimeout(function(){try{window.close();}catch(e){}},500);
    setTimeout(function(){
      setS('done','Terkirim ke T-SPARK AI','Jendela ini boleh ditutup.');
      show(['bAgain','bCopy']);
    },1500);
  }else{
    setS('err','Tidak bisa mengirim ke T-SPARK AI','Jendela T-SPARK AI sepertinya sudah ditutup. Salin teksnya lalu tempel di kotak pertanyaan.');
    show(['bCopy','bAgain']);
  }
}

function copy(){
  var t=txt||$('tx').textContent||'';
  function ok(){var b=$('bCopy');var o=b.textContent;b.textContent='Tersalin';setTimeout(function(){b.textContent=o;},1400);}
  function lama(){
    try{
      var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';
      document.body.appendChild(a);a.select();var good=document.execCommand('copy');document.body.removeChild(a);
      if(good)ok();
    }catch(e){}
  }
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok,lama);return;}
  }catch(e){}
  lama();
}

$('orb').onclick=function(){
  var s=document.body.getAttribute('data-s');
  if(rec&&(s==='listen'||s==='hear')){try{rec.stop();}catch(e){}return;}   /* selesai bicara sekarang */
  start();
};
$('bAgain').onclick=start;
$('bSend').onclick=doSend;
$('bCopy').onclick=copy;
window.addEventListener('pagehide',function(){try{if(rec)rec.abort();}catch(e){}});

post('ready');
start();
})();
</script>
</body>
</html>
